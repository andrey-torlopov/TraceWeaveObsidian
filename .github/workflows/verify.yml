name: Verify plugin
on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d)"
          trap 'rm -rf "$scanner_dir"' EXIT
          cd "$scanner_dir"
          curl --fail --silent --show-error --location --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          checksum_line="$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print}' gitleaks_8.30.1_checksums.txt)"
          test -n "$checksum_line"
          printf '%s\n' "$checksum_line" | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          "$scanner_dir/gitleaks" git "$GITHUB_WORKSPACE" --log-opts='--all --full-history' --redact --no-banner --ignore-gitleaks-allow
      - run: npm ci
      - run: npm run verify:public
      - run: npm test
      - run: npm run package
      - name: Check assembled publication files
        run: npm run verify:public -- --package
